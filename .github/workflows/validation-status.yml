name: Version PR validation status
on:
  workflow_run:
    workflows: [PR checks]
    types: [requested, in_progress, completed]
permissions: {}
concurrency:
  group: version-validation-status-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'changeset-release/main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      # workflow_run uses the default branch. Never execute the triggering PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun scripts/validation-status.ts
        env:
          GH_TOKEN: ${{ github.token }}
