      <main class="workspace" id="workspace">
        <section class="pane pane-editor" aria-label="Program">
          <div class="toolbar" role="toolbar" aria-label="Sterowanie programem">

              <span>Uruchom</span>
            </button>
            <button type="button" id="btn-pause" class="btn" disabled>
              <svg class="ico-pause" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="5" y="4.5" width="3.5" height="11" rx="1" fill="currentColor"/><rect x="11.5" y="4.5" width="3.5" height="11" rx="1" fill="currentColor"/></svg>
              <svg class="ico-resume" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6 4.5v11l9-5.5z" fill="currentColor"/></svg>

          </div>
          <div id="editor"></div>
          <div id="message" class="message" aria-live="polite"></div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-label="Zmień podział okna" aria-orientation="vertical" tabindex="-1"></div>

        <section class="pane pane-canvas" aria-label="Rysunek">
          <div class="stage" id="stage">

              <button type="button" id="btn-grid" class="btn btn-small" aria-pressed="true" title="Pokaż lub ukryj siatkę">

          </div>

        <button type="button" id="help-close" class="btn btn-ghost" aria-label="Zamknij pomoc">✕</button>
