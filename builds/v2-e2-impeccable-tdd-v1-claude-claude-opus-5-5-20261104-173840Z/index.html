    <script>
      // Theme before first paint: the saved choice, else the system's.
      try {
        var t = localStorage.getItem("logomocja:theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        if (localStorage.getItem("logomocja:mode") === "3d") document.documentElement.dataset.mode = "3d";
      } catch (e) {}
    </script>
