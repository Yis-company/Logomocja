<title>Logomocja – pracownia żółwia</title>
<meta name="description" content="Logomocja: polska pracownia żółwia w stylu klasycznego Logo – rysuj programami w 2D i w przestrzeni 3D.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16866a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<script>
// Without the trailing slash relative asset URLs would resolve one level too high.
if (!/\/$|\.html?$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
// Apply the saved theme before first paint.
try { var t = localStorage.getItem("logomocja:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>

</head>
