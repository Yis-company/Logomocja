<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd200" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Logomocja: polskie studio rysowania żółwiem w Logo, na płaszczyźnie i w przestrzeni." />
    <title>Logomocja · studio rysowania żółwiem</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('logomocja.v1.theme') || '"system"');
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <noscript><p class="noscript">Logomocja potrzebuje JavaScriptu, żeby uruchamiać programy żółwia. Włącz JavaScript w przeglądarce i odśwież stronę.</p></noscript>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
