<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Logomocja – polska pracownia żółwia: rysowanie w języku Logo na płaszczyźnie (2D) i w przestrzeni (3D)." />
    <title>Logomocja</title>
    <link rel="icon" type="image/svg+xml" href="%ASSETS%favicon.svg" />
    <link rel="manifest" href="%ASSETS%manifest.webmanifest" />
    <script>
      try {
        var t = localStorage.getItem('logomocja:v1:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="%CSS%" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Logomocja wymaga włączonej obsługi JavaScriptu.</noscript>
    <script defer src="%JS%"></script>
  </body>
</html>
